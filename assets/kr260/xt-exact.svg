<svg xmlns="http://www.w3.org/2000/svg" class="diagram" width="930" height="527" viewBox="0 0 930 527">
<title>The cycle-exact XT</title>
<style>
svg {
  --bg: #fdfdfd;
  --bg2: #f2f0ea;
  --fg: #1b1d22;
  --fg2: #4a4f5a;
  --muted: #7a7f8a;
  --rule: #dcd8ce;
  --accent: #b4451f;
  --link: #1f5fa8;
  --code-bg: #efece4;

  /* clock domains and memories, used by the diagrams */
  --c-cpu: #2f62b0;
  --c-sys: #2b8a4e;
  --c-pix: #7048b8;
  --c-usb: #b07a12;
  --c-osc: #6b6f78;
  --c-ram: #c99a06;
  --c-ext: #a8452a;
  --fill-cpu: #e8effa;
  --fill-sys: #e6f4eb;
  --fill-pix: #efe9f9;
  --fill-usb: #f8f0dd;
  --fill-ram: #fff3c4;
  --fill-ext: #f9e6df;
  --fill-box: #ffffff;
}
.diagram text { font-family: 'IBM Plex Sans', system-ui, sans-serif; fill: var(--fg); }
.diagram .mono { font-family: 'IBM Plex Mono', monospace; }
.diagram .t-title { font-weight: 600; font-size: 14px; }
.diagram .t-sub { font-size: 11.5px; fill: var(--fg2); }
.diagram .t-small { font-size: 10.5px; fill: var(--muted); }
.diagram .t-freq { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 12px; }
.diagram .box { fill: var(--fill-box); stroke: var(--fg2); stroke-width: 1.2; }
.diagram .ram { fill: var(--fill-ram); stroke: var(--c-ram); stroke-width: 1.2; }
.diagram .ext { fill: var(--fill-ext); stroke: var(--c-ext); stroke-width: 1.2; }
.diagram .wire { stroke: var(--fg2); stroke-width: 1.6; fill: none; }
.diagram .wire.thick { stroke-width: 3; }
.diagram .arrowhead { fill: var(--fg2); }
.diagram .dom { stroke-width: 1.6; stroke-dasharray: 6 4; }
.diagram .d-cpu { fill: var(--fill-cpu); stroke: var(--c-cpu); }
.diagram .d-sys { fill: var(--fill-sys); stroke: var(--c-sys); }
.diagram .d-pix { fill: var(--fill-pix); stroke: var(--c-pix); }
.diagram .d-usb { fill: var(--fill-usb); stroke: var(--c-usb); }
.diagram .d-osc { fill: var(--bg2); stroke: var(--c-osc); }
.diagram .k-cpu { fill: var(--c-cpu); }
.diagram .k-sys { fill: var(--c-sys); }
.diagram .k-pix { fill: var(--c-pix); }
.diagram .k-usb { fill: var(--c-usb); }
.diagram .k-osc { fill: var(--c-osc); }
.diagram .s-cpu { stroke: var(--c-cpu); }
.diagram .s-sys { stroke: var(--c-sys); }
.diagram .s-pix { stroke: var(--c-pix); }
.diagram .s-usb { stroke: var(--c-usb); }
.diagram .s-osc { stroke: var(--c-osc); }
.diagram .pkg { fill: var(--bg2); stroke: var(--fg2); stroke-width: 1.5; }
.diagram .die { fill: var(--fill-box); stroke: var(--fg); stroke-width: 1.4; }
.diagram .die-ram { fill: var(--fill-ram); stroke: var(--c-ram); stroke-width: 1.4; }
.diagram .bar { fill: var(--accent); }
.diagram .bar2 { fill: var(--fg2); opacity: 0.35; }
.diagram .grid { stroke: var(--rule); stroke-width: 1; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead" /></marker></defs>
<rect x="20" y="20" width="600" height="421" rx="14" class="dom d-cpu" /><text x="34" y="42" class="t-freq k-cpu">machine clock · 57.27 MHz, 12 per CPU clock</text>
<polyline points="320,107 320,123" class="wire" />
<polyline points="130,145 130,159" class="wire" />
<polyline points="320,145 320,159" class="wire" />
<polyline points="510,145 510,159" class="wire" />
<polyline points="40,134 30,134 30,252 40,252" class="wire" />
<polyline points="106,263 106,277" class="wire" />
<polyline points="248,263 248,277" class="wire" />
<polyline points="390,263 390,277" class="wire" />
<polyline points="532,263 532,277" class="wire" />
<rect x="40" y="123" width="560" height="22" rx="3" class="box" /><text x="320" y="138" class="t-small" text-anchor="middle">8088 bus, with READY and DMA wait states</text>
<rect x="40" y="241" width="560" height="22" rx="3" class="box" /><text x="320" y="256" class="t-small" text-anchor="middle">8-bit ISA</text>
<rect x="40" y="55" width="560" height="52" rx="5" class="box" /><text x="50" y="75" class="t-title">Our 8088</text>
<text x="50" y="92" class="t-sub">Intel&#x27;s microcode, 512 × 21 bits; every T-state, 4.77 MHz</text>
<rect x="40" y="159" width="180" height="66" rx="5" class="ram" /><text x="50" y="179" class="t-title">RAM · 640 KB</text>
<text x="50" y="196" class="t-sub">UltraRAM</text>
<rect x="230" y="159" width="180" height="66" rx="5" class="ram" /><text x="240" y="179" class="t-title">ROMs</text>
<text x="240" y="196" class="t-sub">GLaBIOS at F0000</text>
<text x="240" y="211" class="t-sub">XTIDE at C8000</text>
<rect x="420" y="159" width="180" height="66" rx="5" class="box" /><text x="430" y="179" class="t-title">Chipset, exact</text>
<text x="430" y="196" class="t-sub">8259, 8253, 8255</text>
<text x="430" y="211" class="t-sub">8237: refresh steals cycles</text>
<rect x="40" y="277" width="132" height="66" rx="5" class="box" /><text x="50" y="297" class="t-title">CGA, exact</text>
<text x="50" y="314" class="t-sub">6845 and wait states</text>
<text x="50" y="329" class="t-sub">by character clock</text>
<rect x="182" y="277" width="132" height="66" rx="5" class="box" /><text x="192" y="297" class="t-title">Composite</text>
<text x="192" y="314" class="t-sub">a CGA&#x27;s colour</text>
<text x="192" y="329" class="t-sub">on a TV</text>
<rect x="324" y="277" width="132" height="66" rx="5" class="box" /><text x="334" y="297" class="t-title">XT-IDE</text>
<text x="334" y="314" class="t-sub">XT-CF at 300h</text>
<text x="334" y="329" class="t-sub">ATA disk</text>
<rect x="466" y="277" width="132" height="66" rx="5" class="box" /><text x="476" y="297" class="t-title">Floppy</text>
<text x="476" y="314" class="t-sub">765 class, 2 drives</text>
<text x="476" y="329" class="t-sub">ao486&#x27;s</text>
<rect x="40" y="359" width="132" height="66" rx="5" class="box" /><text x="50" y="379" class="t-title">AdLib</text>
<text x="50" y="396" class="t-sub">OPL2 (jtopl)</text>
<rect x="182" y="359" width="132" height="66" rx="5" class="box" /><text x="192" y="379" class="t-title">COM1</text>
<text x="192" y="396" class="t-sub">8250, serial mouse</text>
<rect x="324" y="359" width="132" height="66" rx="5" class="box" /><text x="334" y="379" class="t-title">PC speaker</text>
<text x="334" y="396" class="t-sub">port 61h</text>
<rect x="466" y="359" width="132" height="66" rx="5" class="box" /><text x="476" y="379" class="t-title">Keyboard</text>
<text x="476" y="396" class="t-sub">XT, exact polling</text>
<rect x="640" y="20" width="270" height="421" rx="14" class="dom d-sys" /><text x="654" y="42" class="t-freq k-sys">shell · 100 MHz</text>
<rect x="658" y="55" width="234" height="66" rx="5" class="box" /><text x="668" y="75" class="t-title">Virtual monitor</text>
<text x="668" y="92" class="t-sub">locks to any raster, 3 buffers</text>
<text x="668" y="107" class="t-sub">scaled to the DisplayPort mode</text>
<polyline points="620,80 658,80" class="wire" marker-end="url(#ah)" />
<rect x="658" y="126" width="234" height="50" rx="5" class="box" /><text x="668" y="146" class="t-title">Audio</text>
<text x="668" y="163" class="t-sub">48 kHz stereo to DisplayPort</text>
<polyline points="620,151 658,151" class="wire" marker-end="url(#ah)" />
<rect x="658" y="197" width="234" height="50" rx="5" class="box" /><text x="668" y="217" class="t-title">Disk mailbox</text>
<text x="668" y="234" class="t-sub">4 KB, requests served by Linux</text>
<polyline points="620,222 658,222" class="wire" marker-start="url(#ah)" marker-end="url(#ah)" />
<rect x="658" y="268" width="234" height="50" rx="5" class="box" /><text x="668" y="288" class="t-title">Input and serial channels</text>
<text x="668" y="305" class="t-sub">scan codes, mouse packets</text>
<polyline points="620,293 658,293" class="wire" marker-start="url(#ah)" marker-end="url(#ah)" />
<rect x="658" y="339" width="234" height="50" rx="5" class="box" /><text x="668" y="359" class="t-title">Load, peek, logic analyser</text>
<text x="668" y="376" class="t-sub">ROMs in, state out</text>
<polyline points="620,364 658,364" class="wire" marker-start="url(#ah)" marker-end="url(#ah)" />
<rect x="20" y="457" width="170" height="50" rx="5" class="ext" /><text x="30" y="477" class="t-title">DisplayPort</text>
<text x="30" y="494" class="t-sub">picture and sound</text>
<rect x="200" y="457" width="170" height="50" rx="5" class="ext" /><text x="210" y="477" class="t-title">DDR4</text>
<text x="210" y="494" class="t-sub">frames</text>
<rect x="380" y="457" width="170" height="50" rx="5" class="ext" /><text x="390" y="477" class="t-title">Linux (4 × A53)</text>
<text x="390" y="494" class="t-sub">pc-run, menu, disk images</text>
<rect x="560" y="457" width="170" height="50" rx="5" class="ext" /><text x="570" y="477" class="t-title">USB</text>
<text x="570" y="494" class="t-sub">keyboard, mouse</text>
<rect x="740" y="457" width="170" height="50" rx="5" class="ext" /><text x="750" y="477" class="t-title">Ethernet</text>
<text x="750" y="494" class="t-sub">file share, time</text>
</svg>
