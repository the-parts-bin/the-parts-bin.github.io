<svg xmlns="http://www.w3.org/2000/svg" class="diagram" width="930" height="635" viewBox="0 0 930 635">
<title>kr260-pc system diagram</title>
<style>
svg {
  --bg: #fdfdfd;
  --bg2: #f2f0ea;
  --fg: #1b1d22;
  --fg2: #4a4f5a;
  --muted: #7a7f8a;
  --rule: #dcd8ce;
  --accent: #b4451f;
  --link: #1f5fa8;
  --code-bg: #efece4;

  /* clock domains and memories, used by the diagrams */
  --c-cpu: #2f62b0;
  --c-sys: #2b8a4e;
  --c-pix: #7048b8;
  --c-usb: #b07a12;
  --c-osc: #6b6f78;
  --c-ram: #c99a06;
  --c-ext: #a8452a;
  --fill-cpu: #e8effa;
  --fill-sys: #e6f4eb;
  --fill-pix: #efe9f9;
  --fill-usb: #f8f0dd;
  --fill-ram: #fff3c4;
  --fill-ext: #f9e6df;
  --fill-box: #ffffff;
}
.diagram text { font-family: 'IBM Plex Sans', system-ui, sans-serif; fill: var(--fg); }
.diagram .mono { font-family: 'IBM Plex Mono', monospace; }
.diagram .t-title { font-weight: 600; font-size: 14px; }
.diagram .t-sub { font-size: 11.5px; fill: var(--fg2); }
.diagram .t-small { font-size: 10.5px; fill: var(--muted); }
.diagram .t-freq { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 12px; }
.diagram .box { fill: var(--fill-box); stroke: var(--fg2); stroke-width: 1.2; }
.diagram .ram { fill: var(--fill-ram); stroke: var(--c-ram); stroke-width: 1.2; }
.diagram .ext { fill: var(--fill-ext); stroke: var(--c-ext); stroke-width: 1.2; }
.diagram .wire { stroke: var(--fg2); stroke-width: 1.6; fill: none; }
.diagram .wire.thick { stroke-width: 3; }
.diagram .arrowhead { fill: var(--fg2); }
.diagram .dom { stroke-width: 1.6; stroke-dasharray: 6 4; }
.diagram .d-cpu { fill: var(--fill-cpu); stroke: var(--c-cpu); }
.diagram .d-sys { fill: var(--fill-sys); stroke: var(--c-sys); }
.diagram .d-pix { fill: var(--fill-pix); stroke: var(--c-pix); }
.diagram .d-usb { fill: var(--fill-usb); stroke: var(--c-usb); }
.diagram .d-osc { fill: var(--bg2); stroke: var(--c-osc); }
.diagram .k-cpu { fill: var(--c-cpu); }
.diagram .k-sys { fill: var(--c-sys); }
.diagram .k-pix { fill: var(--c-pix); }
.diagram .k-usb { fill: var(--c-usb); }
.diagram .k-osc { fill: var(--c-osc); }
.diagram .s-cpu { stroke: var(--c-cpu); }
.diagram .s-sys { stroke: var(--c-sys); }
.diagram .s-pix { stroke: var(--c-pix); }
.diagram .s-usb { stroke: var(--c-usb); }
.diagram .s-osc { stroke: var(--c-osc); }
.diagram .pkg { fill: var(--bg2); stroke: var(--fg2); stroke-width: 1.5; }
.diagram .die { fill: var(--fill-box); stroke: var(--fg); stroke-width: 1.4; }
.diagram .die-ram { fill: var(--fill-ram); stroke: var(--c-ram); stroke-width: 1.4; }
.diagram .bar { fill: var(--accent); }
.diagram .bar2 { fill: var(--fg2); opacity: 0.35; }
.diagram .grid { stroke: var(--rule); stroke-width: 1; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead" /></marker></defs>
<rect x="20" y="20" width="890" height="125" rx="14" class="dom d-usb" /><text x="34" y="42" class="t-freq k-usb">Linux on the Arm cores (4 × Cortex-A53)</text>
<rect x="40" y="62" width="205" height="66" rx="5" class="box" /><text x="50" y="82" class="t-title">pc-run</text>
<text x="50" y="99" class="t-sub">the PC&#x27;s devices: disks,</text>
<text x="50" y="114" class="t-sub">CD-ROM, input, network</text>
<rect x="255" y="62" width="205" height="66" rx="5" class="box" /><text x="265" y="82" class="t-title">kr260-ui</text>
<text x="265" y="99" class="t-sub">the on-screen menu</text>
<text x="265" y="114" class="t-sub">over the PC&#x27;s picture</text>
<rect x="470" y="62" width="205" height="66" rx="5" class="box" /><text x="480" y="82" class="t-title">pc-machine</text>
<text x="480" y="99" class="t-sub">loads a bitstream and</text>
<text x="480" y="114" class="t-sub">restarts as that PC</text>
<rect x="685" y="62" width="205" height="66" rx="5" class="box" /><text x="695" y="82" class="t-title">File share</text>
<text x="695" y="99" class="t-sub">disk images from</text>
<text x="695" y="114" class="t-sub">any machine</text>
<rect x="20" y="235" width="890" height="125" rx="14" class="dom d-sys" /><text x="34" y="257" class="t-freq k-sys">FPGA: platform shell, the same in every bitstream</text>
<rect x="40" y="273" width="162" height="66" rx="5" class="box" /><text x="50" y="293" class="t-title">Virtual monitor</text>
<text x="50" y="310" class="t-sub">locks to the PC&#x27;s sync,</text>
<text x="50" y="325" class="t-sub">scales the picture</text>
<rect x="213" y="273" width="162" height="66" rx="5" class="box" /><text x="223" y="293" class="t-title">Disk mailbox</text>
<text x="223" y="310" class="t-sub">sector and drive</text>
<text x="223" y="325" class="t-sub">requests to Linux</text>
<rect x="386" y="273" width="162" height="66" rx="5" class="box" /><text x="396" y="293" class="t-title">Byte channels</text>
<text x="396" y="310" class="t-sub">scan codes, mouse</text>
<rect x="559" y="273" width="162" height="66" rx="5" class="box" /><text x="569" y="293" class="t-title">Audio</text>
<text x="569" y="310" class="t-sub">to DisplayPort</text>
<rect x="732" y="273" width="162" height="66" rx="5" class="box" /><text x="742" y="293" class="t-title">Logic analyser</text>
<text x="742" y="310" class="t-sub">and state readout</text>
<polyline points="250,145 250,235" class="wire" marker-start="url(#ah)" marker-end="url(#ah)" />
<polyline points="680,145 680,235" class="wire" marker-start="url(#ah)" marker-end="url(#ah)" />
<text x="262" y="194" class="t-small">registers, mailboxes</text><text x="692" y="194" class="t-small">frames, guest RAM in DDR4</text>
<rect x="20" y="420" width="890" height="125" rx="14" class="dom d-cpu" /><text x="34" y="442" class="t-freq k-cpu">FPGA: one machine per bitstream</text>
<rect x="40" y="458" width="133" height="66" rx="5" class="box" /><text x="50" y="478" class="t-title">XT</text>
<text x="50" y="495" class="t-sub">8088, CGA</text>
<text x="50" y="510" class="t-sub">Hercules</text>
<rect x="183" y="458" width="133" height="66" rx="5" class="box" /><text x="193" y="478" class="t-title">Exact XT</text>
<text x="193" y="495" class="t-sub">8088, CGA</text>
<text x="193" y="510" class="t-sub">cycle-exact</text>
<rect x="326" y="458" width="133" height="66" rx="5" class="box" /><text x="336" y="478" class="t-title">AT</text>
<text x="336" y="495" class="t-sub">80286</text>
<text x="336" y="510" class="t-sub">EGA</text>
<rect x="469" y="458" width="133" height="66" rx="5" class="box" /><text x="479" y="478" class="t-title">386</text>
<text x="479" y="495" class="t-sub">z386</text>
<text x="479" y="510" class="t-sub">VGA</text>
<rect x="612" y="458" width="133" height="66" rx="5" class="box" /><text x="622" y="478" class="t-title">486</text>
<text x="622" y="495" class="t-sub">z486, x87</text>
<text x="622" y="510" class="t-sub">ET4000</text>
<rect x="755" y="458" width="133" height="66" rx="5" class="box" /><text x="765" y="478" class="t-title">Pentium</text>
<text x="765" y="495" class="t-sub">z486 P5, PCI</text>
<text x="765" y="510" class="t-sub">S3, Voodoo</text>
<polyline points="465,360 465,420" class="wire" marker-start="url(#ah)" marker-end="url(#ah)" />
<text x="477" y="395" class="t-small">raster, sound, disk and input ports</text>
<rect x="20" y="565" width="212" height="50" rx="5" class="ext" /><text x="30" y="585" class="t-title">DisplayPort</text>
<text x="30" y="602" class="t-sub">picture and sound</text>
<rect x="246" y="565" width="212" height="50" rx="5" class="ext" /><text x="256" y="585" class="t-title">microSD</text>
<text x="256" y="602" class="t-sub">image, disks</text>
<rect x="472" y="565" width="212" height="50" rx="5" class="ext" /><text x="482" y="585" class="t-title">USB</text>
<text x="482" y="602" class="t-sub">keyboard, mouse</text>
<rect x="698" y="565" width="212" height="50" rx="5" class="ext" /><text x="708" y="585" class="t-title">Ethernet</text>
<text x="708" y="602" class="t-sub">network</text>
</svg>
