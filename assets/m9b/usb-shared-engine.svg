<svg xmlns="http://www.w3.org/2000/svg" class="diagram" width="680" height="160" viewBox="0 0 680 160">
  <title>One engine time-shared between two ports, frame by frame</title>
<style>
svg {
  --bg: #fdfdfd;
  --bg2: #f2f0ea;
  --fg: #1b1d22;
  --fg2: #4a4f5a;
  --muted: #7a7f8a;
  --rule: #dcd8ce;
  --accent: #b4451f;
  --link: #1f5fa8;
  --code-bg: #efece4;

  /* clock domains and memories, used by the diagrams */
  --c-cpu: #2f62b0;
  --c-sys: #2b8a4e;
  --c-pix: #7048b8;
  --c-usb: #b07a12;
  --c-osc: #6b6f78;
  --c-ram: #c99a06;
  --c-ext: #a8452a;
  --fill-cpu: #e8effa;
  --fill-sys: #e6f4eb;
  --fill-pix: #efe9f9;
  --fill-usb: #f8f0dd;
  --fill-ram: #fff3c4;
  --fill-ext: #f9e6df;
  --fill-box: #ffffff;
}
.diagram text { font-family: 'IBM Plex Sans', system-ui, sans-serif; fill: var(--fg); }
.diagram .mono { font-family: 'IBM Plex Mono', monospace; }
.diagram .t-title { font-weight: 600; font-size: 14px; }
.diagram .t-sub { font-size: 11.5px; fill: var(--fg2); }
.diagram .t-small { font-size: 10.5px; fill: var(--muted); }
.diagram .t-freq { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 12px; }
.diagram .box { fill: var(--fill-box); stroke: var(--fg2); stroke-width: 1.2; }
.diagram .ram { fill: var(--fill-ram); stroke: var(--c-ram); stroke-width: 1.2; }
.diagram .ext { fill: var(--fill-ext); stroke: var(--c-ext); stroke-width: 1.2; }
.diagram .wire { stroke: var(--fg2); stroke-width: 1.6; fill: none; }
.diagram .wire.thick { stroke-width: 3; }
.diagram .arrowhead { fill: var(--fg2); }
.diagram .dom { stroke-width: 1.6; stroke-dasharray: 6 4; }
.diagram .d-cpu { fill: var(--fill-cpu); stroke: var(--c-cpu); }
.diagram .d-sys { fill: var(--fill-sys); stroke: var(--c-sys); }
.diagram .d-pix { fill: var(--fill-pix); stroke: var(--c-pix); }
.diagram .d-usb { fill: var(--fill-usb); stroke: var(--c-usb); }
.diagram .d-osc { fill: var(--bg2); stroke: var(--c-osc); }
.diagram .k-cpu { fill: var(--c-cpu); }
.diagram .k-sys { fill: var(--c-sys); }
.diagram .k-pix { fill: var(--c-pix); }
.diagram .k-usb { fill: var(--c-usb); }
.diagram .k-osc { fill: var(--c-osc); }
.diagram .s-cpu { stroke: var(--c-cpu); }
.diagram .s-sys { stroke: var(--c-sys); }
.diagram .s-pix { stroke: var(--c-pix); }
.diagram .s-usb { stroke: var(--c-usb); }
.diagram .s-osc { stroke: var(--c-osc); }
.diagram .pkg { fill: var(--bg2); stroke: var(--fg2); stroke-width: 1.5; }
.diagram .die { fill: var(--fill-box); stroke: var(--fg); stroke-width: 1.4; }
.diagram .die-ram { fill: var(--fill-ram); stroke: var(--c-ram); stroke-width: 1.4; }
.diagram .bar { fill: var(--accent); }
.diagram .bar2 { fill: var(--fg2); opacity: 0.35; }
.diagram .grid { stroke: var(--rule); stroke-width: 1; }
</style>
  <!-- 3 frames of 200 px from x=60 -->
  <g class="t-sub"><text x="10" y="58">port 0</text><text x="10" y="108">port 1</text></g>
  <g class="grid">
    <line x1="60" y1="30" x2="60" y2="130"/><line x1="260" y1="30" x2="260" y2="130"/><line x1="460" y1="30" x2="460" y2="130"/><line x1="660" y1="30" x2="660" y2="130"/>
  </g>
  <g class="t-small"><text x="64" y="24">1 ms frame</text><text x="264" y="24">1 ms frame</text><text x="464" y="24">1 ms frame</text></g>
  <rect x="62" y="42" width="44" height="26" rx="3" class="box" style="fill: var(--fill-usb); stroke: var(--c-usb)"/>
  <rect x="108" y="92" width="22" height="26" rx="3" class="box" style="fill: var(--fill-cpu); stroke: var(--c-cpu)"/>
  <rect x="262" y="42" width="22" height="26" rx="3" class="box" style="fill: var(--fill-cpu); stroke: var(--c-cpu)"/>
  <rect x="286" y="92" width="44" height="26" rx="3" class="box" style="fill: var(--fill-usb); stroke: var(--c-usb)"/>
  <rect x="462" y="42" width="44" height="26" rx="3" class="box" style="fill: var(--fill-usb); stroke: var(--c-usb)"/>
  <rect x="508" y="92" width="22" height="26" rx="3" class="box" style="fill: var(--fill-cpu); stroke: var(--c-cpu)"/>
  <g class="wire" style="stroke-dasharray: 3 3; stroke-width: 1">
    <line x1="106" y1="68" x2="108" y2="92"/><line x1="284" y1="68" x2="286" y2="92"/><line x1="506" y1="68" x2="508" y2="92"/>
  </g>
  <rect x="60" y="140" width="12" height="10" style="fill: var(--fill-usb); stroke: var(--c-usb)"/>
  <text x="78" y="149" class="t-small">poll (a transaction)</text>
  <rect x="220" y="140" width="12" height="10" style="fill: var(--fill-cpu); stroke: var(--c-cpu)"/>
  <text x="238" y="149" class="t-small">keep-alive</text>
  <text x="340" y="149" class="t-small">dashed: the engine swaps to the other port at a wait</text>
</svg>
