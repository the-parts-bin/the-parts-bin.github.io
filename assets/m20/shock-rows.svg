<svg xmlns="http://www.w3.org/2000/svg" class="diagram" width="800" height="400" viewBox="0 0 800 400">
  <title>System Shock's mixed line table</title>
<style>
svg {
  --bg: #fdfdfd;
  --bg2: #f2f0ea;
  --fg: #1b1d22;
  --fg2: #4a4f5a;
  --muted: #7a7f8a;
  --rule: #dcd8ce;
  --accent: #b4451f;
  --link: #1f5fa8;
  --code-bg: #efece4;

  /* clock domains and memories, used by the diagrams */
  --c-cpu: #2f62b0;
  --c-sys: #2b8a4e;
  --c-pix: #7048b8;
  --c-usb: #b07a12;
  --c-osc: #6b6f78;
  --c-ram: #c99a06;
  --c-ext: #a8452a;
  --fill-cpu: #e8effa;
  --fill-sys: #e6f4eb;
  --fill-pix: #efe9f9;
  --fill-usb: #f8f0dd;
  --fill-ram: #fff3c4;
  --fill-ext: #f9e6df;
  --fill-box: #ffffff;
}
.diagram text { font-family: 'IBM Plex Sans', system-ui, sans-serif; fill: var(--fg); }
.diagram .mono { font-family: 'IBM Plex Mono', monospace; }
.diagram .t-title { font-weight: 600; font-size: 14px; }
.diagram .t-sub { font-size: 11.5px; fill: var(--fg2); }
.diagram .t-small { font-size: 10.5px; fill: var(--muted); }
.diagram .t-freq { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 12px; }
.diagram .box { fill: var(--fill-box); stroke: var(--fg2); stroke-width: 1.2; }
.diagram .ram { fill: var(--fill-ram); stroke: var(--c-ram); stroke-width: 1.2; }
.diagram .ext { fill: var(--fill-ext); stroke: var(--c-ext); stroke-width: 1.2; }
.diagram .wire { stroke: var(--fg2); stroke-width: 1.6; fill: none; }
.diagram .wire.thick { stroke-width: 3; }
.diagram .arrowhead { fill: var(--fg2); }
.diagram .dom { stroke-width: 1.6; stroke-dasharray: 6 4; }
.diagram .d-cpu { fill: var(--fill-cpu); stroke: var(--c-cpu); }
.diagram .d-sys { fill: var(--fill-sys); stroke: var(--c-sys); }
.diagram .d-pix { fill: var(--fill-pix); stroke: var(--c-pix); }
.diagram .d-usb { fill: var(--fill-usb); stroke: var(--c-usb); }
.diagram .d-osc { fill: var(--bg2); stroke: var(--c-osc); }
.diagram .k-cpu { fill: var(--c-cpu); }
.diagram .k-sys { fill: var(--c-sys); }
.diagram .k-pix { fill: var(--c-pix); }
.diagram .k-usb { fill: var(--c-usb); }
.diagram .k-osc { fill: var(--c-osc); }
.diagram .s-cpu { stroke: var(--c-cpu); }
.diagram .s-sys { stroke: var(--c-sys); }
.diagram .s-pix { stroke: var(--c-pix); }
.diagram .s-usb { stroke: var(--c-usb); }
.diagram .s-osc { stroke: var(--c-osc); }
.diagram .pkg { fill: var(--bg2); stroke: var(--fg2); stroke-width: 1.5; }
.diagram .die { fill: var(--fill-box); stroke: var(--fg); stroke-width: 1.4; }
.diagram .die-ram { fill: var(--fill-ram); stroke: var(--c-ram); stroke-width: 1.4; }
.diagram .bar { fill: var(--accent); }
.diagram .bar2 { fill: var(--fg2); opacity: 0.35; }
.diagram .grid { stroke: var(--rule); stroke-width: 1; }
</style>

<style>
.diagram .hole { fill: url(#hatch); stroke: var(--fg2); stroke-width: 1; }
.diagram .px16 { fill: #cfe0f5; stroke: var(--c-cpu); stroke-width: 1.2; }
.diagram .px8 { fill: var(--bg2); stroke: var(--fg2); stroke-width: 1.2; }
.diagram .wall { fill: #8fa6c4; }
.diagram .wall2 { fill: #6f88aa; }
.diagram .floor { fill: #a39a88; }
.diagram .sprite { fill: #c0563a; }
.diagram .hud { fill: #2b8a4e; }
</style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead" /></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ffffff" /><line x1="0" y1="0" x2="0" y2="8" stroke="#b4451f" stroke-width="2" /></pattern>
  </defs>
<text x="20" y="26" class="t-title" text-anchor="start">System Shock at 640 × 480: the line table mixes two kinds of row</text>
<rect x="20" y="50" width="70" height="300" class="box" />
<text x="55" y="370" class="t-sub" text-anchor="middle">line table</text>
<text x="55" y="386" class="t-small" text-anchor="middle">720 entries</text>
<rect x="24" y="51" width="62" height="8" class="px8" />
<rect x="24" y="61" width="62" height="8" class="px8" />
<rect x="24" y="71" width="62" height="8" class="px8" />
<rect x="24" y="81" width="62" height="8" class="px8" />
<rect x="24" y="91" width="62" height="8" class="px8" />
<rect x="24" y="101" width="62" height="8" class="px8" />
<rect x="24" y="111" width="62" height="8" class="px16" />
<rect x="24" y="121" width="62" height="8" class="px16" />
<rect x="24" y="131" width="62" height="8" class="px16" />
<rect x="24" y="141" width="62" height="8" class="px16" />
<rect x="24" y="151" width="62" height="8" class="px16" />
<rect x="24" y="161" width="62" height="8" class="px16" />
<rect x="24" y="171" width="62" height="8" class="px16" />
<rect x="24" y="181" width="62" height="8" class="px16" />
<rect x="24" y="191" width="62" height="8" class="px16" />
<rect x="24" y="201" width="62" height="8" class="px16" />
<rect x="24" y="211" width="62" height="8" class="px16" />
<rect x="24" y="221" width="62" height="8" class="px16" />
<rect x="24" y="231" width="62" height="8" class="px16" />
<rect x="24" y="241" width="62" height="8" class="px16" />
<rect x="24" y="251" width="62" height="8" class="px16" />
<rect x="24" y="261" width="62" height="8" class="px16" />
<rect x="24" y="271" width="62" height="8" class="px8" />
<rect x="24" y="281" width="62" height="8" class="px8" />
<rect x="24" y="291" width="62" height="8" class="px8" />
<rect x="24" y="301" width="62" height="8" class="px8" />
<rect x="24" y="311" width="62" height="8" class="px8" />
<rect x="24" y="321" width="62" height="8" class="px8" />
<rect x="24" y="331" width="62" height="8" class="px8" />
<rect x="24" y="341" width="62" height="8" class="px8" />
<rect x="200" y="50" width="240" height="180" class="px8" />
<text x="210" y="70" class="t-title" text-anchor="start">the game's screen, 8 bpp</text>
<text x="210" y="88" class="t-sub" text-anchor="start">640 × 480 · 300 KB · its interface</text>
<rect x="221" y="72" width="198" height="0" class="box" />
<rect x="221" y="98" width="198" height="72" class="hole" />
<text x="320" y="205" class="t-small" text-anchor="middle">rows outside the view: shown from here</text>
<text x="320" y="220" class="t-small" text-anchor="middle">(rarely change; may tear for a frame)</text>
<rect x="520" y="110" width="250" height="100" class="px16" />
<rect x="534" y="124" width="250" height="100" class="px16" />
<rect x="548" y="138" width="250" height="100" class="px16" />
<text x="558" y="160" class="t-title" text-anchor="start">display buffers × 3, RGB565</text>
<text x="558" y="178" class="t-sub" text-anchor="start">just the view's 259 rows, 330 KB each:</text>
<text x="558" y="196" class="t-sub" text-anchor="start">the engine's pixels, the CPU's over them;</text>
<text x="558" y="214" class="t-sub" text-anchor="start">the side columns only when they change</text>
<rect x="268" y="124" width="104" height="20" fill="#ffffff" stroke="#4a4f5a" stroke-width="0.8" />
<text x="320" y="138" class="t-sub" text-anchor="middle">the view: holes</text>
<polyline points="90,70 200,70" class="wire" marker-end="url(#ah)" />
<polyline points="90,330 150,330 150,150 200,150" class="wire" marker-end="url(#ah)" />
<polyline points="90,160 170,160 170,255 490,255 490,200 548,200" class="wire s-cpu" marker-end="url(#ah)" />
<text x="178" y="270" class="t-small" text-anchor="start">16 bpp lines: the view's rows</text>
<text x="96" y="62" class="t-small" text-anchor="start">8 bpp lines</text>
<text x="320" y="310" class="t-sub" text-anchor="start">Whole RGB565 frames (3 × 614 KB) didn't fit: with them the game's</text>
<text x="320" y="328" class="t-sub" text-anchor="start">resources failed to load. Now the buffers take 93 KB more than the</text>
<text x="320" y="346" class="t-sub" text-anchor="start">8 bpp ones did, and the hardware fetches each line in either format.</text>
</svg>
