<svg xmlns="http://www.w3.org/2000/svg" class="diagram" width="900" height="280" viewBox="0 0 900 280">
  <title>Sharing a frame between the CPU and the span engine</title>
<style>
svg {
  --bg: #fdfdfd;
  --bg2: #f2f0ea;
  --fg: #1b1d22;
  --fg2: #4a4f5a;
  --muted: #7a7f8a;
  --rule: #dcd8ce;
  --accent: #b4451f;
  --link: #1f5fa8;
  --code-bg: #efece4;

  /* clock domains and memories, used by the diagrams */
  --c-cpu: #2f62b0;
  --c-sys: #2b8a4e;
  --c-pix: #7048b8;
  --c-usb: #b07a12;
  --c-osc: #6b6f78;
  --c-ram: #c99a06;
  --c-ext: #a8452a;
  --fill-cpu: #e8effa;
  --fill-sys: #e6f4eb;
  --fill-pix: #efe9f9;
  --fill-usb: #f8f0dd;
  --fill-ram: #fff3c4;
  --fill-ext: #f9e6df;
  --fill-box: #ffffff;
}
.diagram text { font-family: 'IBM Plex Sans', system-ui, sans-serif; fill: var(--fg); }
.diagram .mono { font-family: 'IBM Plex Mono', monospace; }
.diagram .t-title { font-weight: 600; font-size: 14px; }
.diagram .t-sub { font-size: 11.5px; fill: var(--fg2); }
.diagram .t-small { font-size: 10.5px; fill: var(--muted); }
.diagram .t-freq { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 12px; }
.diagram .box { fill: var(--fill-box); stroke: var(--fg2); stroke-width: 1.2; }
.diagram .ram { fill: var(--fill-ram); stroke: var(--c-ram); stroke-width: 1.2; }
.diagram .ext { fill: var(--fill-ext); stroke: var(--c-ext); stroke-width: 1.2; }
.diagram .wire { stroke: var(--fg2); stroke-width: 1.6; fill: none; }
.diagram .wire.thick { stroke-width: 3; }
.diagram .arrowhead { fill: var(--fg2); }
.diagram .dom { stroke-width: 1.6; stroke-dasharray: 6 4; }
.diagram .d-cpu { fill: var(--fill-cpu); stroke: var(--c-cpu); }
.diagram .d-sys { fill: var(--fill-sys); stroke: var(--c-sys); }
.diagram .d-pix { fill: var(--fill-pix); stroke: var(--c-pix); }
.diagram .d-usb { fill: var(--fill-usb); stroke: var(--c-usb); }
.diagram .d-osc { fill: var(--bg2); stroke: var(--c-osc); }
.diagram .k-cpu { fill: var(--c-cpu); }
.diagram .k-sys { fill: var(--c-sys); }
.diagram .k-pix { fill: var(--c-pix); }
.diagram .k-usb { fill: var(--c-usb); }
.diagram .k-osc { fill: var(--c-osc); }
.diagram .s-cpu { stroke: var(--c-cpu); }
.diagram .s-sys { stroke: var(--c-sys); }
.diagram .s-pix { stroke: var(--c-pix); }
.diagram .s-usb { stroke: var(--c-usb); }
.diagram .s-osc { stroke: var(--c-osc); }
.diagram .pkg { fill: var(--bg2); stroke: var(--fg2); stroke-width: 1.5; }
.diagram .die { fill: var(--fill-box); stroke: var(--fg); stroke-width: 1.4; }
.diagram .die-ram { fill: var(--fill-ram); stroke: var(--c-ram); stroke-width: 1.4; }
.diagram .bar { fill: var(--accent); }
.diagram .bar2 { fill: var(--fg2); opacity: 0.35; }
.diagram .grid { stroke: var(--rule); stroke-width: 1; }
</style>

<style>
.diagram .hole { fill: url(#hatch); stroke: var(--fg2); stroke-width: 1; }
.diagram .px16 { fill: #cfe0f5; stroke: var(--c-cpu); stroke-width: 1.2; }
.diagram .px8 { fill: var(--bg2); stroke: var(--fg2); stroke-width: 1.2; }
.diagram .wall { fill: #8fa6c4; }
.diagram .wall2 { fill: #6f88aa; }
.diagram .floor { fill: #a39a88; }
.diagram .sprite { fill: #c0563a; }
.diagram .hud { fill: #2b8a4e; }
</style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead" /></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ffffff" /><line x1="0" y1="0" x2="0" y2="8" stroke="#b4451f" stroke-width="2" /></pattern>
  </defs>
<rect x="20" y="50" width="260" height="160" class="px8" />
<polygon points="20,50 90,90 90,160 20,210" class="hole" />
<polygon points="280,50 210,90 210,160 280,210" class="hole" />
<polygon points="90,90 210,90 210,160 90,160" class="hole" />
<polygon points="20,210 90,160 210,160 280,210" class="hole" />
<polygon points="20,50 280,50 210,90 90,90" class="hole" />
<circle cx="170" cy="145" r="16" class="sprite" />
<rect x="28" y="190" width="60" height="9" class="hud" />
<rect x="220" y="190" width="50" height="9" class="hud" />
<rect x="320" y="50" width="260" height="160" class="px8" />
<polygon points="320,50 390,90 390,160 320,210" class="wall" />
<polygon points="580,50 510,90 510,160 580,210" class="wall" />
<polygon points="390,90 510,90 510,160 390,160" class="wall2" />
<polygon points="320,210 390,160 510,160 580,210" class="floor" />
<polygon points="320,50 580,50 510,90 390,90" class="wall2" />
<rect x="620" y="50" width="260" height="160" class="px16" />
<polygon points="620,50 690,90 690,160 620,210" class="wall" />
<polygon points="880,50 810,90 810,160 880,210" class="wall" />
<polygon points="690,90 810,90 810,160 690,160" class="wall2" />
<polygon points="620,210 690,160 810,160 880,210" class="floor" />
<polygon points="620,50 880,50 810,90 690,90" class="wall2" />
<circle cx="770" cy="145" r="16" class="sprite" />
<rect x="628" y="190" width="60" height="9" class="hud" />
<rect x="820" y="190" width="50" height="9" class="hud" />
<text x="20" y="36" class="t-title" text-anchor="start">CPU: the 8 bpp canvas</text>
<text x="320" y="36" class="t-title" text-anchor="start">Engine: RGB565, in the frame shown</text>
<text x="620" y="36" class="t-title" text-anchor="start">Composed: the frame on screen</text>
<text x="20" y="235" class="t-sub" text-anchor="start">Under every engine span the canvas gets holes</text>
<text x="20" y="251" class="t-sub" text-anchor="start">(colour 255); sprites, transparent walls and</text>
<text x="20" y="267" class="t-sub" text-anchor="start">the HUD are drawn as before.</text>
<text x="320" y="235" class="t-sub" text-anchor="start">The engine draws the opaque textured walls</text>
<text x="320" y="251" class="t-sub" text-anchor="start">straight into the display buffer; the CPU</text>
<text x="320" y="267" class="t-sub" text-anchor="start">never waits for it until the frame is done.</text>
<text x="620" y="235" class="t-sub" text-anchor="start">The canvas's pixels that aren't holes go over</text>
<text x="620" y="251" class="t-sub" text-anchor="start">the engine's, through the palette: whichever</text>
<text x="620" y="267" class="t-sub" text-anchor="start">drew a pixel last wins.</text>
<polyline points="285,130 315,130" class="wire" marker-end="url(#ah)" />
<polyline points="585,130 615,130" class="wire" marker-end="url(#ah)" />
</svg>
