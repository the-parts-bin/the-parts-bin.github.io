<svg xmlns="http://www.w3.org/2000/svg" class="diagram" width="1020" height="230" viewBox="0 0 1020 230">
  <title>The span engine's pipeline</title>
<style>
svg {
  --bg: #fdfdfd;
  --bg2: #f2f0ea;
  --fg: #1b1d22;
  --fg2: #4a4f5a;
  --muted: #7a7f8a;
  --rule: #dcd8ce;
  --accent: #b4451f;
  --link: #1f5fa8;
  --code-bg: #efece4;

  /* clock domains and memories, used by the diagrams */
  --c-cpu: #2f62b0;
  --c-sys: #2b8a4e;
  --c-pix: #7048b8;
  --c-usb: #b07a12;
  --c-osc: #6b6f78;
  --c-ram: #c99a06;
  --c-ext: #a8452a;
  --fill-cpu: #e8effa;
  --fill-sys: #e6f4eb;
  --fill-pix: #efe9f9;
  --fill-usb: #f8f0dd;
  --fill-ram: #fff3c4;
  --fill-ext: #f9e6df;
  --fill-box: #ffffff;
}
.diagram text { font-family: 'IBM Plex Sans', system-ui, sans-serif; fill: var(--fg); }
.diagram .mono { font-family: 'IBM Plex Mono', monospace; }
.diagram .t-title { font-weight: 600; font-size: 14px; }
.diagram .t-sub { font-size: 11.5px; fill: var(--fg2); }
.diagram .t-small { font-size: 10.5px; fill: var(--muted); }
.diagram .t-freq { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 12px; }
.diagram .box { fill: var(--fill-box); stroke: var(--fg2); stroke-width: 1.2; }
.diagram .ram { fill: var(--fill-ram); stroke: var(--c-ram); stroke-width: 1.2; }
.diagram .ext { fill: var(--fill-ext); stroke: var(--c-ext); stroke-width: 1.2; }
.diagram .wire { stroke: var(--fg2); stroke-width: 1.6; fill: none; }
.diagram .wire.thick { stroke-width: 3; }
.diagram .arrowhead { fill: var(--fg2); }
.diagram .dom { stroke-width: 1.6; stroke-dasharray: 6 4; }
.diagram .d-cpu { fill: var(--fill-cpu); stroke: var(--c-cpu); }
.diagram .d-sys { fill: var(--fill-sys); stroke: var(--c-sys); }
.diagram .d-pix { fill: var(--fill-pix); stroke: var(--c-pix); }
.diagram .d-usb { fill: var(--fill-usb); stroke: var(--c-usb); }
.diagram .d-osc { fill: var(--bg2); stroke: var(--c-osc); }
.diagram .k-cpu { fill: var(--c-cpu); }
.diagram .k-sys { fill: var(--c-sys); }
.diagram .k-pix { fill: var(--c-pix); }
.diagram .k-usb { fill: var(--c-usb); }
.diagram .k-osc { fill: var(--c-osc); }
.diagram .s-cpu { stroke: var(--c-cpu); }
.diagram .s-sys { stroke: var(--c-sys); }
.diagram .s-pix { stroke: var(--c-pix); }
.diagram .s-usb { stroke: var(--c-usb); }
.diagram .s-osc { stroke: var(--c-osc); }
.diagram .pkg { fill: var(--bg2); stroke: var(--fg2); stroke-width: 1.5; }
.diagram .die { fill: var(--fill-box); stroke: var(--fg); stroke-width: 1.4; }
.diagram .die-ram { fill: var(--fill-ram); stroke: var(--c-ram); stroke-width: 1.4; }
.diagram .bar { fill: var(--accent); }
.diagram .bar2 { fill: var(--fg2); opacity: 0.35; }
.diagram .grid { stroke: var(--rule); stroke-width: 1; }
</style>

<style>
.diagram .hole { fill: url(#hatch); stroke: var(--fg2); stroke-width: 1; }
.diagram .px16 { fill: #cfe0f5; stroke: var(--c-cpu); stroke-width: 1.2; }
.diagram .px8 { fill: var(--bg2); stroke: var(--fg2); stroke-width: 1.2; }
.diagram .wall { fill: #8fa6c4; }
.diagram .wall2 { fill: #6f88aa; }
.diagram .floor { fill: #a39a88; }
.diagram .sprite { fill: #c0563a; }
.diagram .hud { fill: #2b8a4e; }
</style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead" /></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ffffff" /><line x1="0" y1="0" x2="0" y2="8" stroke="#b4451f" stroke-width="2" /></pattern>
  </defs>
<rect x="20" y="60" width="150" height="70" rx="5" class="box" />
<text x="30" y="80" class="t-title">CPU</text>
<text x="30" y="97" class="t-sub">registers, then</text>
<text x="30" y="112" class="t-sub">spans {count, v, u}</text>
<rect x="190" y="60" width="150" height="70" rx="5" class="box" />
<text x="200" y="80" class="t-title">FIFO</text>
<text x="200" y="97" class="t-sub">512 commands</text>
<text x="200" y="112" class="t-sub">(a full one stalls)</text>
<polyline points="170,95 190,95" class="wire" marker-end="url(#ah)" />
<rect x="360" y="60" width="150" height="70" rx="5" class="box" />
<text x="370" y="80" class="t-title">Span core</text>
<text x="370" y="97" class="t-sub">s/z, t/z, 1/z: exact</text>
<text x="370" y="112" class="t-sub">every 16 pixels</text>
<polyline points="340,95 360,95" class="wire" marker-end="url(#ah)" />
<rect x="530" y="60" width="150" height="70" rx="5" class="ram" />
<text x="540" y="80" class="t-title">Texel cache</text>
<text x="540" y="97" class="t-sub">2 KB direct-mapped</text>
<text x="540" y="112" class="t-sub">a miss: 1 SDRAM line</text>
<polyline points="510,95 530,95" class="wire" marker-end="url(#ah)" />
<rect x="700" y="60" width="150" height="70" rx="5" class="box" />
<text x="710" y="80" class="t-title">Palette + light</text>
<text x="710" y="97" class="t-sub">RGB888 × lightmap</text>
<text x="710" y="112" class="t-sub">(bilinear), DSPs</text>
<polyline points="680,95 700,95" class="wire" marker-end="url(#ah)" />
<rect x="870" y="60" width="150" height="70" rx="5" class="box" />
<text x="880" y="80" class="t-title">Write buffers</text>
<text x="880" y="97" class="t-sub">frame + z, 64 B</text>
<text x="880" y="112" class="t-sub">lines, byte masks</text>
<polyline points="850,95 870,95" class="wire" marker-end="url(#ah)" />
<rect x="870" y="160" width="130" height="50" rx="5" class="ram" />
<text x="880" y="180" class="t-title">SDRAM</text>
<text x="880" y="197" class="t-sub">engine port</text>
<polyline points="935,130 935,160" class="wire" marker-start="url(#ah)" marker-end="url(#ah)" />
<polyline points="617,130 617,185 870,185" class="wire" marker-end="url(#ah)" />
<text x="630" y="178" class="t-small" text-anchor="start">texture lines in</text>
<text x="20" y="175" class="t-sub" text-anchor="start">Per surface (once): the planes s/z, t/z and 1/z with their exponents, the texture</text>
<text x="20" y="193" class="t-sub" text-anchor="start">(power-of-two sizes, wrapping), the lightmap (up to 31 × 31 samples, 2ᵏ texels apart).</text>
<text x="20" y="211" class="t-sub" text-anchor="start">Per span: one 32-bit word. Per pixel: one clock while the texels hit the cache.</text>
<text x="20" y="30" class="t-title" text-anchor="start">The span engine's pipeline: cpu_clk, 54 MHz</text>
</svg>
